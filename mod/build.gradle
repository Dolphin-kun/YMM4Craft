tasks.register('collectJars') {
    def outputs = [
            'fabric'         : ['fabric', 'jar'],
            'neoforge'       : ['neoforge', 'jar'],
            'neoforge-1.21.1': ['neoforge', 'jar'],
            'forge-1.20.1'   : ['forge', 'reobfJar'],
    ]
    dependsOn outputs.keySet().collect { ":${it}:build" }
    doLast {
        outputs.each { path, output ->
            copy {
                from project(":${path}").tasks.named(output[1]).flatMap { it.archiveFile }
                into rootProject.file("../dist/mod/${output[0]}")
            }
        }
    }
}
