tasks.register('collectJars') {
    dependsOn ':fabric:build', ':neoforge:build'
    doLast {
        ['fabric', 'neoforge'].each { loader ->
            copy {
                from project(":${loader}").tasks.named('jar').flatMap { it.archiveFile }
                into rootProject.file("../dist/mod/${loader}")
            }
        }
    }
}
